<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cơ sở dữ liệu ngành giáo dục</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center font-sans">

    <header class="w-full bg-[#90244c] flex justify-between items-center px-8 py-3 text-white shadow-md">
        <div class="flex items-center gap-4">
            <img
    src="{{ url_for('static', filename='images/logo.png') }}"
    class="w-12 h-12 rounded-full object-contain bg-white p-1 shadow"
/>
            <div>
                <h1 class="text-sm font-semibold uppercase">Sở Giáo Dục và Đào Tạo Tỉnh Khánh Hòa</h1>
                <h2 class="text-lg font-bold text-yellow-400 uppercase">Cơ sở dữ liệu ngành giáo dục và đào tạo</h2>
            </div>
        </div>
        <div class="font-semibold hidden md:block">
            Hotline: 19004740
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center w-full px-4 mt-8 mb-8">
        <div class="bg-white shadow-2xl rounded-xl border border-gray-200 flex flex-col md:flex-row w-full max-w-5xl overflow-hidden">

            <div class="hidden md:flex md:w-1/2 p-12 items-center justify-center bg-white">
    <img
        src="{{ url_for('static', filename='images/login.png') }}"
        class="w-64 h-64 object-contain"
    >
</div>

            <div class="w-full md:w-1/2 p-10 md:p-16 flex flex-col justify-center border-l border-gray-100">
                <div class="flex items-center gap-4 mb-8">
                    <div class="w-16 h-16 rounded-full bg-[#90244c] flex items-center justify-center text-white shrink-0">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-black uppercase tracking-wide">Đăng nhập hệ thống</h2>
                        <p class="text-gray-600 text-lg">Quản lý cấp Trường</p>
                    </div>
                </div>

                <h3 class="font-bold text-black mb-4 uppercase">Tài khoản của bạn</h3>

                <form action="/login" method="POST" class="space-y-5">

    {% if error %}
    <div class="bg-red-100 text-red-700 px-4 py-3 rounded-md text-sm font-medium">
        {{ error }}
    </div>
    {% endif %}

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input
                            type="text"
                            name="phone"
                            placeholder="Nhập số điện thoại"
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 border-none rounded-md focus:ring-2 focus:ring-[#90244c] outline-none"
                            required
                        >
                    </div>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input
                            type="password"
                            name="password"
                            placeholder="Nhập mật khẩu"
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 border-none rounded-md focus:ring-2 focus:ring-[#90244c] outline-none"
                            required
                        >
                    </div>

                    <div class="flex items-center justify-between text-sm">
    <a href="{{ url_for('forgot_password') }}" class="text-blue-600 hover:underline font-medium">
        Quên mật khẩu?
    </a>
</div>

                    <button
                        type="submit"
                        class="w-full bg-[#90244c] text-white font-bold py-3 rounded-md hover:bg-[#7a1e40] transition-colors uppercase mt-4"
                    >
                        Đăng nhập
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
