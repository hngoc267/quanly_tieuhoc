{% extends "base.html" %}
{% block content %}

<style>
.box {
    background: #fff;
    border: 1px solid #ccc;
}

.box-header {
    padding: 10px;
    background: #f0f0f0;
    border-bottom: 1px solid #ddd;
    font-weight: bold;
}

/* FILTER */
.filter {
    padding: 15px;
}

.filter-form {
    display: flex;
    gap: 40px;
    align-items: center;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 10px;
}

.filter-group select {
    width: 180px;
    height: 32px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #1f5d8a;
    color: white;
    padding: 10px;
    border: 1px solid #ccc;
}

td {
    padding: 8px;
    border: 1px solid #ddd;
    text-align: center;
}

tr:nth-child(even) {
    background: #f9f9f9;
}

/* BUTTON */
.btn {
    background: #1f78b4;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
}
</style>

<div class="box">

<!-- HEADER: Cập nhật đường dẫn cho nút Nhập PCCM -->
<div class="box-header" style="display:flex; justify-content:space-between;">
    <div>📘 Phân công chuyên môn</div>

    <div>
        <!-- Cập nhật href để dẫn về trang nhập liệu từ Excel -->
        <a href="{{ url_for('import_pcm_page') }}" class="btn">Nhập PCCM từ Excel</a>

        <a href="{{ url_for('export_pcm_by_class',
            semester_id=selected_semester,
            grade_id=selected_grade,
            class_id=selected_class) }}" class="btn">
            Xuất Excel
        </a>
    </div>
</div>

    <!-- FILTER -->
    <div class="filter">
        <form method="GET" class="filter-form">
            <div class="filter-group">
    <label>Học kỳ:</label>
    <select name="semester_id" onchange="this.form.submit()">
        {% for s in semesters %}
            <option value="{{ s.semester_id }}"
                {% if selected_semester == s.semester_id %}selected{% endif %}>
                {{ s.semester_name }}
            </option>
        {% endfor %}
    </select>
</div>

            <div class="filter-group">
                <label>Khối:</label>
                <select name="grade_id" onchange="this.form.submit()">
                    <option value="">Chọn</option>
                    {% for g in grades %}
                        <option value="{{ g.grade_id }}"
                        {% if selected_grade == g.grade_id %}selected{% endif %}>
                            Khối {{ g.grade_id }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="filter-group">
                <label>Lớp:</label>
                <select name="class_id" onchange="this.form.submit()">
                    <option value="">Chọn</option>
                    {% for c in classes %}
                        <option value="{{ c.class_id }}"
                        {% if selected_class == c.class_id %}selected{% endif %}>
                            {{ c.class_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

        </form>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Mã GV</th>
                <th>Họ tên</th>
                <th>Môn dạy</th>
            </tr>
        </thead>

        <tbody>
            {% if data %}
                {% for row in data %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ row.teacher_id }}</td>
                    <td>{{ row.name }}</td>
                    <td>{{ row.subjects }}</td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="4">Chưa có dữ liệu</td>
                </tr>
            {% endif %}
        </tbody>
    </table>

</div>

{% endblock %}
